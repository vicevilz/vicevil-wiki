backend:
  name: github
  repo: vicevilz/vicevil-wiki
  branch: main
  auth_scope: repo
  base_url: https://auth.vicevil.wiki
  auth_endpoint: auth
  site_domain: vicevil.wiki

media_folder: static/img/uploads
public_folder: /img/uploads
publish_mode: simple

collections:
  - name: documentation
    label: Documentación
    label_singular: Página
    folder: docs
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}} · {{dirname}}"
    sortable_fields: [title, sidebar_position]
    nested:
      depth: 100
      summary: "{{title}}"
      subfolders: false
    meta:
      path:
        widget: string
        label: Ruta y carpeta
        hint: "Ejemplos: mi-plugin/instalacion o 01-mi-plugin/02-comandos. Los prefijos numéricos ordenan la barra lateral y Docusaurus no los muestra."
        index_file: index
    fields:
      - label: Título
        name: title
        widget: string
      - label: Etiqueta de la barra lateral
        name: sidebar_label
        widget: string
        required: false
        hint: "Déjalo vacío para usar el título de la página."
      - label: Posición en la barra lateral
        name: sidebar_position
        widget: number
        value_type: int
        min: 1
        required: false
      - label: URL personalizada
        name: slug
        widget: string
        required: false
        hint: "Opcional. Si está vacío, la URL se obtiene de la ruta del archivo."
      - label: Descripción
        name: description
        widget: text
        required: false
      - label: Palabras clave
        name: keywords
        widget: list
        required: false
      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false
      - label: Ocultar título
        name: hide_title
        widget: boolean
        default: false
        required: false
      - label: Ocultar índice de la página
        name: hide_table_of_contents
        widget: boolean
        default: false
        required: false
      - label: Nivel mínimo del índice
        name: toc_min_heading_level
        widget: select
        options: [2, 3, 4, 5, 6]
        default: 2
        required: false
      - label: Nivel máximo del índice
        name: toc_max_heading_level
        widget: select
        options: [2, 3, 4, 5, 6]
        default: 3
        required: false
      - label: Contenido
        name: body
        widget: richtext
        modes: [rich_text, raw]
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - quote
          - bulleted-list
          - numbered-list
        editor_components: [image, code-block, docusaurus-admonition, docusaurus-details, docusaurus-tabs]
        hint: "El modo visual incluye formato, imágenes, código, avisos, desplegables y pestañas. Usa el modo raw para tablas, HTML, JSX, componentes React y cualquier sintaxis MDX avanzada."
